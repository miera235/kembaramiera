<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kembara Celik Kata Sendi Nama</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .ticker {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      padding: 18px 0;
      background: transparent;
    }

    .ticker-text {
      display: inline-block;
      padding-left: 100%;
      font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(20px, 4vw, 34px);
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.3;
      color: #ff5c8a;
      text-shadow: 1px 2px 0 rgba(255, 196, 0, 0.22);
      animation: slide-right 16s linear infinite;
    }

    @keyframes slide-right {
      from { transform: translateX(-100%); }
      to   { transform: translateX(100vw); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker-text { animation: none; padding-left: 0; }
    }
  </style>
</head>
<body>
  <div class="ticker" aria-label="Selamat datang ke Kembara Celik Kata Sendi Nama">
    <div class="ticker-text">
      🌈 SELAMAT DATANG KE KEMBARA CELIK KATA SENDI NAMA! 🚀
    </div>
  </div>
</body>
</html>
