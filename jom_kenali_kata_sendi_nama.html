<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jom Kenali Kata Sendi Nama</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: transparent;
      overflow: hidden;
    }
    .ticker {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      padding: 16px 0;
      background: transparent;
    }
    .ticker-text {
      display: inline-block;
      padding-left: 100%;
      font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.3;
      background: linear-gradient(90deg, #ff4d6d, #ff9f1c, #ffd60a, #38b000, #00b4d8, #9d4edd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: slide-right 14s linear infinite;
    }
    @keyframes slide-right {
      from { transform: translateX(-100%); }
      to   { transform: translateX(100vw); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ticker-text { animation: none; padding-left: 0; }
    }
  </style>
</head>
<body>
  <div class="ticker" aria-label="Jom Kenali Kata Sendi Nama">
    <div class="ticker-text">🌈 JOM KENALI KATA SENDI NAMA! ✨</div>
  </div>
</body>
</html>
